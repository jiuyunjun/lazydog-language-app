<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: Roboto, system-ui, sans-serif; background: #FEF7FF; color: #1D1B20; }
    a { color: #6750A4; } a:hover { color: #4F378B; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; min-height: 1010px; background: #FEF7FF; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; gap: 4px; height: 64px; padding: 0px 4px 0px 4px; flex-shrink: 0">
    <div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" stroke="#1D1B20" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div style="font: 400 22px/28px Roboto, sans-serif; color: #1D1B20; flex-grow: 1">今日单词</div>
    <div style="display: flex; align-items: center; gap: 8px; padding-right: 16px">
      <div style="font: 500 12px/16px Roboto, sans-serif; letter-spacing: 0.5px; color: #49454F">3 / 8</div>
      <div style="width: 56px; height: 4px; border-radius: 2px; background: #E8DEF8; display: flex">
        <div style="width: 21px; height: 4px; border-radius: 2px; background: #6750A4"></div>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 20px; padding: 4px 16px 16px 16px; flex-grow: 1">

    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; align-items: center; gap: 8px">
        <div style="font: 400 32px/40px Roboto, sans-serif; color: #1D1B20">grip</div>
        <div style="width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4v-5Z" stroke="#6750A4" stroke-width="1.8" stroke-linejoin="round"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.8a7.5 7.5 0 0 1 0 10.4" stroke="#6750A4" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
      </div>
      <div style="font: 400 16px/24px 'Roboto Mono', monospace; letter-spacing: 0.15px; color: #49454F">/ɡrɪp/</div>
      <div style="font: 500 16px/24px Roboto, sans-serif; letter-spacing: 0.15px; color: #1D1B20; padding-top: 6px">动词　紧握；牢牢抓住</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 6px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0" aria-hidden="true"><rect x="3.2" y="5.2" width="17.6" height="13.6" rx="2.4" stroke="#49454F" stroke-width="1.8"/><circle cx="8.8" cy="10" r="1.6" stroke="#49454F" stroke-width="1.6"/><path d="M4 16.4 9.2 12l3.4 3 2.6-2.2 4.8 4.2" stroke="#49454F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div style="font: 500 12px/16px Roboto, sans-serif; letter-spacing: 0.5px; color: #49454F; flex-grow: 1">这个词义看起来是这样</div>
      </div>

      <div style="width: 358px; height: 202px; border-radius: 12px; overflow: hidden; background: #ECE6F0; position: relative">
        <svg width="358" height="202" viewBox="0 0 358 202" fill="none" aria-label="一只手紧紧握住一根金属横杆的照片">
          <rect width="358" height="202" fill="#DFD8E4"/>
          <rect x="0" y="132" width="358" height="70" fill="#D2CAD9"/>
          <rect x="14" y="94" width="330" height="24" rx="12" fill="#8F8A99"/>
          <rect x="14" y="98" width="330" height="7" rx="3.5" fill="#B4AFBD"/>
          <rect x="14" y="112" width="330" height="4" rx="2" fill="#6E6979"/>
          <path d="M128 106c0-14 10-24 24-24h58c14 0 24 10 24 24v22c0 15-11 26-26 26h-56c-14 0-24-10-24-24v-24Z" fill="#D9A981"/>
          <rect x="130" y="70" width="27" height="58" rx="13.5" fill="#E8BE95"/>
          <rect x="160" y="66" width="27" height="62" rx="13.5" fill="#EFC79E"/>
          <rect x="190" y="68" width="27" height="60" rx="13.5" fill="#E8BE95"/>
          <rect x="220" y="74" width="26" height="54" rx="13" fill="#DEB48B"/>
          <path d="M136 116h100" stroke="#C99C76" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
          <rect x="118" y="120" width="52" height="24" rx="12" fill="#E8BE95" transform="rotate(-14 118 120)"/>
          <path d="M0 132h358" stroke="#C7BFCE" stroke-width="2"/>
        </svg>
      </div>

      <div style="display: flex; align-items: center; gap: 4px">
        <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0">
          <div style="font: 400 11px/16px Roboto, sans-serif; letter-spacing: 0.5px; color: #79747E">来自网络搜索 · unsplash.com</div>
          <div style="font: 400 11px/16px Roboto, sans-serif; letter-spacing: 0.5px; color: #79747E">图片版权归原站所有 · 点开看出处</div>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0px 12px; border-radius: 20px; border: 1px solid #CAC4D0; font: 500 14px/20px Roboto, sans-serif; letter-spacing: 0.1px; color: #6750A4; flex-shrink: 0">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.1-5M19 4.5V9h-4.5" stroke="#6750A4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          换一张
        </div>
        <div style="width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="5.5" r="1.6" fill="#49454F"/><circle cx="12" cy="12" r="1.6" fill="#49454F"/><circle cx="12" cy="18.5" r="1.6" fill="#49454F"/></svg>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; background: #F3EDF7; border-radius: 12px; padding: 16px">
      <div style="display: flex; align-items: flex-start; gap: 4px">
        <div style="font: 400 16px/24px Roboto, sans-serif; letter-spacing: 0.5px; color: #1D1B20; flex-grow: 1">She gripped the handle tightly.</div>
        <div style="width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4v-5Z" stroke="#6750A4" stroke-width="1.8" stroke-linejoin="round"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.8a7.5 7.5 0 0 1 0 10.4" stroke="#6750A4" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
      </div>
      <div style="font: 400 14px/20px Roboto, sans-serif; letter-spacing: 0.25px; color: #49454F">她紧紧攥住了把手。</div>
      <div style="font: 400 11px/16px Roboto, sans-serif; letter-spacing: 0.5px; color: #79747E">单击朗读 · 双击查词 · 三击讲整句</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; background: #E8DEF8; border-radius: 12px; padding: 16px">
      <div style="display: flex; align-items: center; gap: 6px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0" aria-hidden="true"><path d="M9 17.5h6M10 20.5h4M12 3.5a5.5 5.5 0 0 1 3.4 9.8c-.6.5-.9 1.1-.9 1.7H9.5c0-.6-.3-1.2-.9-1.7A5.5 5.5 0 0 1 12 3.5Z" stroke="#1D192B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div style="font: 500 14px/20px Roboto, sans-serif; letter-spacing: 0.1px; color: #1D192B; flex-grow: 1">怎么记</div>
      </div>
      <div style="font: 500 16px/24px Roboto, sans-serif; letter-spacing: 0.15px; color: #1D192B">「格哩普」——攥住的手咯吱作响。手一收紧，grip。</div>
      <div style="display: flex; gap: 4px; padding-top: 4px">
        <div style="display: flex; align-items: center; gap: 4px; height: 40px; padding: 0px 12px; border-radius: 20px; font: 500 14px/20px Roboto, sans-serif; letter-spacing: 0.1px; color: #6750A4">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" stroke="#6750A4" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.6" stroke="#6750A4" stroke-width="1.8"/></svg>
          遮住，回想一下
        </div>
        <div style="display: flex; align-items: center; gap: 4px; height: 40px; padding: 0px 12px; border-radius: 20px; font: 500 14px/20px Roboto, sans-serif; letter-spacing: 0.1px; color: #6750A4">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.1-5M19 4.5V9h-4.5" stroke="#6750A4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          换个记法
        </div>
      </div>
    </div>

  </div>

  <div style="background: #F3EDF7; padding: 12px 16px 24px 16px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0">
    <div style="font: 500 12px/16px Roboto, sans-serif; letter-spacing: 0.5px; color: #49454F">刚才想起来费劲吗？</div>
    <div style="display: flex; gap: 8px">
      <div style="flex-grow: 1; height: 48px; border-radius: 24px; border: 1px solid #CAC4D0; display: flex; align-items: center; justify-content: center; font: 500 14px/20px Roboto, sans-serif; letter-spacing: 0.1px; color: #49454F">忘了</div>
      <div style="flex-grow: 1; height: 48px; border-radius: 24px; border: 1px solid #CAC4D0; display: flex; align-items: center; justify-content: center; font: 500 14px/20px Roboto, sans-serif; letter-spacing: 0.1px; color: #49454F">有点难</div>
      <div style="flex-grow: 1; height: 48px; border-radius: 24px; border: 1px solid #CAC4D0; display: flex; align-items: center; justify-content: center; font: 500 14px/20px Roboto, sans-serif; letter-spacing: 0.1px; color: #49454F">还行</div>
      <div style="flex-grow: 1; height: 48px; border-radius: 24px; background: #6750A4; display: flex; align-items: center; justify-content: center; font: 500 14px/20px Roboto, sans-serif; letter-spacing: 0.1px; color: #FFFFFF">很简单</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
