<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: Roboto, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; background: #FEF7FF; color: #1D1B20; }
    a { color: #6750A4; } a:hover { color: #4F378B; }
    * { box-sizing: border-box; }
    .tile { border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 92px; }
    .ipa { font: 400 22px/28px "Roboto Mono", monospace; }
    .st { font: 400 11px/16px Roboto, sans-serif; letter-spacing: 0.5px; }
  </style>
</helmet>

<div style="width: 390px; min-height: 1120px; background: #FEF7FF; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; gap: 4px; height: 64px; padding: 0px 4px; flex-shrink: 0">
    <div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" stroke="#1D1B20" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div style="font: 400 22px/28px Roboto, sans-serif; color: #1D1B20; flex-grow: 1">全部声音</div>
    <div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.8" stroke="#49454F" stroke-width="1.8"/><path d="m16.2 16.2 4 4" stroke="#49454F" stroke-width="1.8" stroke-linecap="round"/></svg>
    </div>
  </div>

  <div style="padding: 4px 16px 12px 16px">
    <div style="display: flex; height: 40px; border: 1px solid #79747E; border-radius: 20px; overflow: hidden">
      <div style="flex-grow: 1; background: #E8DEF8; display: flex; align-items: center; justify-content: center; gap: 6px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 6.5 9.5 17 4.5 12" stroke="#1D192B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div style="font: 500 14px/20px Roboto, sans-serif; letter-spacing: 0.1px; color: #1D192B">元音</div>
      </div>
      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; border-left: 1px solid #79747E; font: 500 14px/20px Roboto, sans-serif; letter-spacing: 0.1px; color: #49454F">辅音</div>
      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; border-left: 1px solid #79747E; font: 500 14px/20px Roboto, sans-serif; letter-spacing: 0.1px; color: #49454F">对比</div>
    </div>
  </div>

  <div style="padding: 4px 16px 32px 16px; display: flex; flex-direction: column; gap: 24px">

    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: baseline; gap: 8px">
        <div style="font: 500 14px/20px Roboto, sans-serif; letter-spacing: 0.1px; color: #1D1B20; flex-grow: 1">短元音</div>
        <div style="font: 400 11px/16px Roboto, sans-serif; letter-spacing: 0.5px; color: #79747E">7 个 · 稳了 2</div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">

        <div class="tile" style="background: #DCEDE3">
          <div class="ipa" style="color: #0F2A1C">/ɪ/</div>
          <div style="display: flex; align-items: center; gap: 5px">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0" aria-hidden="true"><path d="M20 6.5 9.5 17 4.5 12" stroke="#0F2A1C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div class="st" style="color: #0F2A1C">稳了</div>
          </div>
          <div style="display: flex; gap: 3px">
            <div style="flex-grow: 1; height: 3px; border-radius: 2px; background: #B6D6C4; display: flex"><div style="width: 88%; height: 3px; border-radius: 2px; background: #2E6B4F"></div></div>
            <div style="flex-grow: 1; height: 3px; border-radius: 2px; background: #B6D6C4; display: flex"><div style="width: 84%; height: 3px; border-radius: 2px; background: #2E6B4F"></div></div>
          </div>
        </div>

        <div class="tile" style="background: #F3EDF7">
          <div class="ipa" style="color: #1D1B20">/e/</div>
          <div style="display: flex; align-items: center; gap: 5px">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4" stroke="#49454F" stroke-width="2"/><path d="M8 12h8" stroke="#49454F" stroke-width="2" stroke-linecap="round"/></svg>
            <div class="st" style="color: #49454F">在练发音</div>
          </div>
          <div style="display: flex; gap: 3px">
            <div style="flex-grow: 1; height: 3px; border-radius: 2px; background: #E8DEF8; display: flex"><div style="width: 79%; height: 3px; border-radius: 2px; background: #6750A4"></div></div>
            <div style="flex-grow: 1; height: 3px; border-radius: 2px; background: #E8DEF8; display: flex"><div style="width: 58%; height: 3px; border-radius: 2px; background: #6750A4"></div></div>
          </div>
        </div>

        <div class="tile" style="background: #F3EDF7">
          <div class="ipa" style="color: #1D1B20">/æ/</div>
          <div style="display: flex; align-items: center; gap: 5px">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4v-5Z" stroke="#49454F" stroke-width="2" stroke-linejoin="round"/></svg>
            <div class="st" style="color: #49454F">能听辨</div>
          </div>
          <div style="display: flex; gap: 3px">
            <div style="flex-grow: 1; height: 3px; border-radius: 2px; background: #E8DEF8; display: flex"><div style="width: 76%; height: 3px; border-radius: 2px; background: #6750A4"></div></div>
            <div style="flex-grow: 1; height: 3px; border-radius: 2px; background: #E8DEF8; display: flex"><div style="width: 22%; height: 3px; border-radius: 2px; background: #6750A4"></div></div>
          </div>
        </div>

        <div class="tile" style="background: #F3EDF7">
          <div class="ipa" style="color: #1D1B20">/ʌ/</div>
          <div style="display: flex; align-items: center; gap: 5px">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="#49454F" stroke-width="2"/></svg>
            <div class="st" style="color: #49454F">认识了</div>
          </div>
          <div style="display: flex; gap: 3px">
            <div style="flex-grow: 1; height: 3px; border-radius: 2px; background: #E8DEF8; display: flex"><div style="width: 34%; height: 3px; border-radius: 2px; background: #6750A4"></div></div>
            <div style="flex-grow: 1; height: 3px; border-radius: 2px; background: #E8DEF8"></div>
          </div>
        </div>

        <div class="tile" style="background: #FEF7FF; border: 1px dashed #CAC4D0">
          <div class="ipa" style="color: #79747E">/ʊ/</div>
          <div class="st" style="color: #79747E">还没练过</div>
        </div>

        <div class="tile" style="background: #FEF7FF; border: 1px dashed #CAC4D0">
          <div class="ipa" style="color: #79747E">/ɒ/</div>
          <div class="st" style="color: #79747E">还没练过</div>
        </div>

      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: baseline; gap: 8px">
        <div style="font: 500 14px/20px Roboto, sans-serif; letter-spacing: 0.1px; color: #1D1B20; flex-grow: 1">长元音</div>
        <div style="font: 400 11px/16px Roboto, sans-serif; letter-spacing: 0.5px; color: #79747E">5 个 · 稳了 1</div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <div class="tile" style="background: #DCEDE3">
          <div class="ipa" style="color: #0F2A1C">/iː/</div>
          <div style="display: flex; align-items: center; gap: 5px">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0" aria-hidden="true"><path d="M20 6.5 9.5 17 4.5 12" stroke="#0F2A1C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div class="st" style="color: #0F2A1C">稳了</div>
          </div>
          <div style="display: flex; gap: 3px">
            <div style="flex-grow: 1; height: 3px; border-radius: 2px; background: #B6D6C4; display: flex"><div style="width: 90%; height: 3px; border-radius: 2px; background: #2E6B4F"></div></div>
            <div style="flex-grow: 1; height: 3px; border-radius: 2px; background: #B6D6C4; display: flex"><div style="width: 86%; height: 3px; border-radius: 2px; background: #2E6B4F"></div></div>
          </div>
        </div>
        <div class="tile" style="background: #F3EDF7">
          <div class="ipa" style="color: #1D1B20">/ɑː/</div>
          <div style="display: flex; align-items: center; gap: 5px">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4v-5Z" stroke="#49454F" stroke-width="2" stroke-linejoin="round"/></svg>
            <div class="st" style="color: #49454F">能听辨</div>
          </div>
          <div style="display: flex; gap: 3px">
            <div style="flex-grow: 1; height: 3px; border-radius: 2px; background: #E8DEF8; display: flex"><div style="width: 80%; height: 3px; border-radius: 2px; background: #6750A4"></div></div>
            <div style="flex-grow: 1; height: 3px; border-radius: 2px; background: #E8DEF8; display: flex"><div style="width: 40%; height: 3px; border-radius: 2px; background: #6750A4"></div></div>
          </div>
        </div>
        <div class="tile" style="background: #FEF7FF; border: 1px dashed #CAC4D0">
          <div class="ipa" style="color: #79747E">/ɜː/</div>
          <div class="st" style="color: #79747E">还没练过</div>
        </div>
      </div>
    </div>

    <div style="background: #F3EDF7; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="font: 500 14px/20px Roboto, sans-serif; letter-spacing: 0.1px; color: #1D1B20">五种状态怎么读</div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; gap: 10px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="#49454F" stroke-width="2" stroke-dasharray="3 3"/></svg>
          <div style="font: 400 12px/18px Roboto, sans-serif; color: #49454F; width: 62px">还没练过</div>
          <div style="font: 400 12px/18px Roboto, sans-serif; color: #79747E; flex-grow: 1">没见过这个音</div>
        </div>
        <div style="display: flex; align-items: center; gap: 10px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="#49454F" stroke-width="2"/></svg>
          <div style="font: 400 12px/18px Roboto, sans-serif; color: #49454F; width: 62px">认识了</div>
          <div style="font: 400 12px/18px Roboto, sans-serif; color: #79747E; flex-grow: 1">看过音位卡，知道大概什么声</div>
        </div>
        <div style="display: flex; align-items: center; gap: 10px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4v-5Z" stroke="#49454F" stroke-width="2" stroke-linejoin="round"/></svg>
          <div style="font: 400 12px/18px Roboto, sans-serif; color: #49454F; width: 62px">能听辨</div>
          <div style="font: 400 12px/18px Roboto, sans-serif; color: #79747E; flex-grow: 1">在最小对立里稳定分得出</div>
        </div>
        <div style="display: flex; align-items: center; gap: 10px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4" stroke="#49454F" stroke-width="2"/><path d="M8 12h8" stroke="#49454F" stroke-width="2" stroke-linecap="round"/></svg>
          <div style="font: 400 12px/18px Roboto, sans-serif; color: #49454F; width: 62px">在练发音</div>
          <div style="font: 400 12px/18px Roboto, sans-serif; color: #79747E; flex-grow: 1">多个词里能发出来，还不稳</div>
        </div>
        <div style="display: flex; align-items: center; gap: 10px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0" aria-hidden="true"><path d="M20 6.5 9.5 17 4.5 12" stroke="#2E6B4F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div style="font: 400 12px/18px Roboto, sans-serif; color: #49454F; width: 62px">稳了</div>
          <div style="font: 400 12px/18px Roboto, sans-serif; color: #79747E; flex-grow: 1">换词、换人、进句子都保持得住</div>
        </div>
      </div>
      <div style="font: 400 11px/16px Roboto, sans-serif; letter-spacing: 0.5px; color: #79747E">状态同时用文字、图标和进度条表达，不靠颜色区分。「稳了」只是这个模块里的状态，不代表全局掌握。</div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
