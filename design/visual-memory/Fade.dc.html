<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: Roboto, system-ui, sans-serif; background: #FEF7FF; color: #1D1B20; }
    a { color: #6750A4; } a:hover { color: #4F378B; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; min-height: 1120px; background: #FEF7FF; display: flex; flex-direction: column; gap: 20px; padding: 24px 16px 32px 16px">

  <div style="display: flex; flex-direction: column; gap: 4px">
    <div style="font: 400 22px/28px Roboto, sans-serif; color: #1D1B20">图会一次比一次少</div>
    <div style="font: 400 14px/20px Roboto, sans-serif; letter-spacing: 0.25px; color: #49454F">最后要记住的是这个英语词，不是那张图。复习到第三档，图就不出现了。</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 8px">
      <div style="background: #6750A4; border-radius: 4px; padding: 2px 6px; font: 500 11px/16px Roboto, sans-serif; letter-spacing: 0.5px; color: #FFFFFF">第一次见 · 图在正面</div>
    </div>
    <div style="background: #F3EDF7; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
      <div style="width: 330px; height: 150px; border-radius: 10px; overflow: hidden">
        <svg width="330" height="150" viewBox="0 0 330 150" fill="none" aria-label="一只手紧紧握住一根金属横杆的照片">
          <rect width="330" height="150" fill="#DFD8E4"/>
          <rect x="0" y="98" width="330" height="52" fill="#D2CAD9"/>
          <rect x="12" y="68" width="306" height="20" rx="10" fill="#8F8A99"/>
          <rect x="12" y="71" width="306" height="6" rx="3" fill="#B4AFBD"/>
          <path d="M116 78c0-12 8-20 20-20h56c12 0 20 8 20 20v18c0 12-9 21-21 21h-54c-12 0-21-8-21-20V78Z" fill="#D9A981"/>
          <rect x="118" y="48" width="24" height="48" rx="12" fill="#E8BE95"/>
          <rect x="145" y="44" width="24" height="52" rx="12" fill="#EFC79E"/>
          <rect x="172" y="46" width="24" height="50" rx="12" fill="#E8BE95"/>
          <rect x="199" y="52" width="23" height="44" rx="11.5" fill="#DEB48B"/>
          <rect x="106" y="90" width="46" height="21" rx="10.5" fill="#E8BE95" transform="rotate(-14 106 90)"/>
        </svg>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <div style="font: 400 28px/36px Roboto, sans-serif; color: #1D1B20; flex-grow: 1">grip</div>
        <div style="height: 40px; padding: 0px 16px; border-radius: 20px; border: 1px solid #CAC4D0; display: flex; align-items: center; font: 500 14px/20px Roboto, sans-serif; letter-spacing: 0.1px; color: #6750A4">看意思</div>
      </div>
    </div>
    <div style="font: 400 11px/16px Roboto, sans-serif; letter-spacing: 0.5px; color: #79747E">先看图再看词，图片承担理解成本。第 1～2 次复习都用这一档。</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 8px">
      <div style="background: #625B71; border-radius: 4px; padding: 2px 6px; font: 500 11px/16px Roboto, sans-serif; letter-spacing: 0.5px; color: #FFFFFF">熟一点 · 图退到答案面</div>
    </div>
    <div style="display: flex; gap: 8px">
      <div style="flex-grow: 1; background: #F3EDF7; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px; justify-content: center; min-height: 132px">
        <div style="font: 400 11px/16px Roboto, sans-serif; letter-spacing: 0.5px; color: #79747E">正面</div>
        <div style="font: 400 28px/36px Roboto, sans-serif; color: #1D1B20">grip</div>
        <div style="font: 400 12px/16px Roboto, sans-serif; letter-spacing: 0.4px; color: #49454F">先自己想一下</div>
      </div>
      <div style="flex-grow: 1; background: #F3EDF7; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px; min-height: 132px">
        <div style="font: 400 11px/16px Roboto, sans-serif; letter-spacing: 0.5px; color: #79747E">翻面</div>
        <div style="font: 500 14px/20px Roboto, sans-serif; letter-spacing: 0.1px; color: #1D1B20">紧握</div>
        <div style="width: 100%; height: 64px; border-radius: 8px; overflow: hidden">
          <svg width="151" height="64" viewBox="0 0 151 64" preserveAspectRatio="xMidYMid slice" fill="none" aria-label="一只手握住金属横杆的缩略图">
            <rect width="151" height="64" fill="#DFD8E4"/>
            <rect x="0" y="44" width="151" height="20" fill="#D2CAD9"/>
            <rect x="6" y="30" width="139" height="9" rx="4.5" fill="#8F8A99"/>
            <path d="M52 34c0-5 3-8 8-8h26c5 0 8 3 8 8v8c0 5-3 9-8 9H60c-5 0-8-4-8-9v-8Z" fill="#D9A981"/>
            <rect x="53" y="20" width="10" height="20" rx="5" fill="#E8BE95"/>
            <rect x="65" y="18" width="10" height="22" rx="5" fill="#EFC79E"/>
            <rect x="77" y="19" width="10" height="21" rx="5" fill="#E8BE95"/>
          </svg>
        </div>
      </div>
    </div>
    <div style="font: 400 11px/16px Roboto, sans-serif; letter-spacing: 0.5px; color: #79747E">正面只给词形，图只在答案里当确认。防止靠图猜词。</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 8px">
      <div style="background: #625B71; border-radius: 4px; padding: 2px 6px; font: 500 11px/16px Roboto, sans-serif; letter-spacing: 0.5px; color: #FFFFFF">已经熟了 · 不给图</div>
    </div>
    <div style="background: #F3EDF7; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
      <div style="font: 400 12px/16px Roboto, sans-serif; letter-spacing: 0.4px; color: #49454F">紧紧攥住把手</div>
      <div style="height: 48px; border-radius: 8px; border: 1px solid #CAC4D0; background: #FEF7FF; display: flex; align-items: center; padding: 0px 14px; font: 400 16px/24px Roboto, sans-serif; letter-spacing: 0.5px; color: #79747E">g_ _ _ the handle</div>
      <div style="font: 400 11px/16px Roboto, sans-serif; letter-spacing: 0.5px; color: #79747E">图片在这一档完全不出现，词卡里也不留入口。</div>
    </div>
    <div style="font: 400 11px/16px Roboto, sans-serif; letter-spacing: 0.5px; color: #79747E">在「记录」里点开这个词仍然能看到图——那是查阅，不是复习。</div>
  </div>

</div>
</x-dc>
</body>
</html>
