<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: Roboto, system-ui, sans-serif; background: #FEF7FF; color: #1D1B20; }
    a { color: #6750A4; } a:hover { color: #4F378B; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; min-height: 1030px; background: #FEF7FF; display: flex; flex-direction: column; gap: 20px; padding: 24px 16px 32px 16px">

  <div style="display: flex; flex-direction: column; gap: 4px">
    <div style="font: 400 22px/28px Roboto, sans-serif; color: #1D1B20">同一个词，两张不一样的图</div>
    <div style="font: 400 14px/20px Roboto, sans-serif; letter-spacing: 0.25px; color: #49454F">图跟的是意思，不是这五个字母。charge 常用的意思有四个，你在学的这两个各配各的。</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; background: #F3EDF7; border-radius: 16px; padding: 14px">
    <div style="display: flex; align-items: baseline; gap: 8px">
      <div style="font: 400 28px/36px Roboto, sans-serif; color: #1D1B20">charge</div>
      <div style="font: 400 14px/20px 'Roboto Mono', monospace; letter-spacing: 0.25px; color: #49454F">/tʃɑːrdʒ/</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 8px">
        <div style="background: #6750A4; border-radius: 4px; padding: 2px 6px; font: 500 11px/16px Roboto, sans-serif; letter-spacing: 0.5px; color: #FFFFFF">意思 1</div>
        <div style="font: 500 16px/24px Roboto, sans-serif; letter-spacing: 0.15px; color: #1D1B20">动词　给……充电</div>
      </div>
      <div style="width: 330px; height: 132px; border-radius: 10px; overflow: hidden">
        <svg width="330" height="132" viewBox="0 0 330 132" fill="none" aria-label="一部正在充电的手机，屏幕上显示电池图标">
          <rect width="330" height="132" fill="#DCE4E0"/>
          <rect x="0" y="94" width="330" height="38" fill="#CBD5D0"/>
          <rect x="120" y="16" width="90" height="96" rx="12" fill="#2F3437"/>
          <rect x="127" y="23" width="76" height="82" rx="7" fill="#E8F0EA"/>
          <rect x="147" y="48" width="30" height="17" rx="4" stroke="#3E7A52" stroke-width="3" fill="none"/>
          <rect x="150" y="51" width="18" height="11" rx="2" fill="#3E7A52"/>
          <rect x="178" y="52" width="4" height="9" rx="1.5" fill="#3E7A52"/>
          <path d="M166 72h-8l6 9h-8" stroke="#3E7A52" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M165 112v8h84" stroke="#8E9793" stroke-width="5" stroke-linecap="round" fill="none"/>
          <rect x="243" y="112" width="20" height="16" rx="3" fill="#8E9793"/>
        </svg>
      </div>
      <div style="font: 400 14px/20px Roboto, sans-serif; letter-spacing: 0.25px; color: #49454F">I need to charge my phone.</div>
    </div>

    <div style="height: 1px; background: #CAC4D0"></div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 8px">
        <div style="background: #6750A4; border-radius: 4px; padding: 2px 6px; font: 500 11px/16px Roboto, sans-serif; letter-spacing: 0.5px; color: #FFFFFF">意思 2</div>
        <div style="font: 500 16px/24px Roboto, sans-serif; letter-spacing: 0.15px; color: #1D1B20">动词　指控；控告</div>
      </div>
      <div style="width: 330px; height: 132px; border-radius: 10px; overflow: hidden">
        <svg width="330" height="132" viewBox="0 0 330 132" fill="none" aria-label="法庭上的法槌和垫木">
          <rect width="330" height="132" fill="#E4DDD4"/>
          <rect x="0" y="92" width="330" height="40" fill="#C9BCA9"/>
          <rect x="118" y="84" width="94" height="14" rx="4" fill="#8A6A45"/>
          <rect x="128" y="78" width="74" height="8" rx="3" fill="#A07E55"/>
          <rect x="150" y="30" width="72" height="22" rx="8" fill="#8A6A45" transform="rotate(-28 150 30)"/>
          <rect x="120" y="52" width="62" height="12" rx="6" fill="#A07E55" transform="rotate(-28 120 52)"/>
          <path d="M40 92V60h44v32" stroke="#B0A491" stroke-width="4" fill="none"/>
          <path d="M246 92V54h44v38" stroke="#B0A491" stroke-width="4" fill="none"/>
        </svg>
      </div>
      <div style="font: 400 14px/20px Roboto, sans-serif; letter-spacing: 0.25px; color: #49454F">He was charged with theft.</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; background: #E8DEF8; border-radius: 16px; padding: 16px">
    <div style="font: 500 16px/24px Roboto, sans-serif; letter-spacing: 0.15px; color: #1D192B">哪张图是「给……充电」？</div>
    <div style="display: flex; gap: 10px">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
        <div style="width: 100%; height: 88px; border-radius: 10px; overflow: hidden; border: 2px solid transparent">
          <svg width="153" height="88" viewBox="0 0 153 88" preserveAspectRatio="xMidYMid slice" fill="none" aria-label="法庭上的法槌">
            <rect width="153" height="88" fill="#E4DDD4"/>
            <rect x="0" y="62" width="153" height="26" fill="#C9BCA9"/>
            <rect x="52" y="56" width="52" height="10" rx="3" fill="#8A6A45"/>
            <rect x="70" y="18" width="46" height="15" rx="6" fill="#8A6A45" transform="rotate(-28 70 18)"/>
            <rect x="52" y="32" width="40" height="9" rx="4.5" fill="#A07E55" transform="rotate(-28 52 32)"/>
          </svg>
        </div>
        <div style="font: 400 12px/16px Roboto, sans-serif; letter-spacing: 0.4px; color: #1D192B; text-align: center">A</div>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
        <div style="width: 100%; height: 88px; border-radius: 10px; overflow: hidden; border: 2px solid transparent">
          <svg width="153" height="88" viewBox="0 0 153 88" preserveAspectRatio="xMidYMid slice" fill="none" aria-label="一部正在充电的手机">
            <rect width="153" height="88" fill="#DCE4E0"/>
            <rect x="0" y="64" width="153" height="24" fill="#CBD5D0"/>
            <rect x="54" y="10" width="60" height="66" rx="9" fill="#2F3437"/>
            <rect x="59" y="15" width="50" height="56" rx="5" fill="#E8F0EA"/>
            <rect x="72" y="32" width="24" height="14" rx="3" stroke="#3E7A52" stroke-width="2.6" fill="none"/>
            <rect x="74" y="34" width="14" height="9" rx="1.6" fill="#3E7A52"/>
          </svg>
        </div>
        <div style="font: 400 12px/16px Roboto, sans-serif; letter-spacing: 0.4px; color: #1D192B; text-align: center">B</div>
      </div>
    </div>
    <div style="font: 400 12px/16px Roboto, sans-serif; letter-spacing: 0.4px; color: #1D192B">一个词在学两个意思时才出这道题；答错只把答错的那个意思排进复习，不动另一个。</div>
  </div>

</div>
</x-dc>
</body>
</html>
