<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: Roboto, system-ui, sans-serif; background: #FEF7FF; color: #1D1B20; }
    a { color: #6750A4; } a:hover { color: #4F378B; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #FEF7FF; position: relative; overflow: hidden">

  <div style="display: flex; flex-direction: column; gap: 2px; padding: 68px 16px 0px 16px">
    <div style="font: 400 32px/40px Roboto, sans-serif; color: #1D1B20">grip</div>
    <div style="font: 400 16px/24px 'Roboto Mono', monospace; letter-spacing: 0.15px; color: #49454F">/ɡrɪp/</div>
    <div style="font: 500 16px/24px Roboto, sans-serif; letter-spacing: 0.15px; color: #1D1B20; padding-top: 6px">动词　紧握；牢牢抓住</div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.32)"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #F3EDF7; border-radius: 28px 28px 0px 0px; display: flex; flex-direction: column; gap: 16px; padding: 12px 0px 24px 0px">

    <div style="display: flex; justify-content: center">
      <div style="width: 32px; height: 4px; border-radius: 2px; background: #CAC4D0"></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px; padding: 0px 24px">
      <div style="font: 400 22px/28px Roboto, sans-serif; color: #1D1B20">换一张</div>
      <div style="font: 400 14px/20px Roboto, sans-serif; letter-spacing: 0.25px; color: #49454F">都是照着「紧握」这个意思找的，不是照着 grip 这个词</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 0px 16px">

      <div style="display: flex; align-items: center; gap: 12px; background: #E8DEF8; border: 2px solid #6750A4; border-radius: 16px; padding: 10px">
        <div style="width: 116px; height: 84px; border-radius: 10px; overflow: hidden; flex-shrink: 0">
          <svg width="116" height="84" viewBox="0 0 116 84" fill="none" aria-label="一只手握住金属横杆">
            <rect width="116" height="84" fill="#DFD8E4"/>
            <rect x="0" y="56" width="116" height="28" fill="#D2CAD9"/>
            <rect x="4" y="38" width="108" height="11" rx="5.5" fill="#8F8A99"/>
            <rect x="4" y="40" width="108" height="3" rx="1.5" fill="#B4AFBD"/>
            <path d="M38 44c0-6 4-10 10-10h20c6 0 10 4 10 10v10c0 6-4 10-10 10H48c-6 0-10-4-10-10V44Z" fill="#D9A981"/>
            <rect x="39" y="26" width="11" height="26" rx="5.5" fill="#E8BE95"/>
            <rect x="52" y="24" width="11" height="28" rx="5.5" fill="#EFC79E"/>
            <rect x="65" y="25" width="11" height="27" rx="5.5" fill="#E8BE95"/>
            <rect x="34" y="50" width="22" height="10" rx="5" fill="#E8BE95" transform="rotate(-14 34 50)"/>
          </svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1; min-width: 0">
          <div style="display: flex; align-items: center; gap: 6px">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#6750A4"/><path d="m8 12.2 2.6 2.6L16 9.4" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div style="font: 500 14px/20px Roboto, sans-serif; letter-spacing: 0.1px; color: #1D192B">正在用这张</div>
          </div>
          <div style="font: 400 12px/16px Roboto, sans-serif; letter-spacing: 0.4px; color: #49454F">手指明显收紧，抓的是什么一眼能看清</div>
          <div style="font: 400 11px/16px Roboto, sans-serif; letter-spacing: 0.5px; color: #79747E">unsplash.com</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; background: #FEF7FF; border: 1px solid #CAC4D0; border-radius: 16px; padding: 10px">
        <div style="width: 116px; height: 84px; border-radius: 10px; overflow: hidden; flex-shrink: 0">
          <svg width="116" height="84" viewBox="0 0 116 84" fill="none" aria-label="一只手扣住岩壁边缘">
            <rect width="116" height="84" fill="#CFD8DC"/>
            <path d="M0 46h116v38H0z" fill="#8D8378"/>
            <path d="M0 46c18-6 34-2 52-8s34-12 64-6v6H0Z" fill="#A2988B"/>
            <path d="M28 40h56v10H28z" fill="#B5AB9D"/>
            <path d="M44 42c0-5 4-8 9-8h16c5 0 9 3 9 8v12c0 5-4 9-9 9H53c-5 0-9-4-9-9V42Z" fill="#D9A981"/>
            <rect x="46" y="30" width="10" height="22" rx="5" fill="#E8BE95"/>
            <rect x="58" y="28" width="10" height="24" rx="5" fill="#EFC79E"/>
            <rect x="70" y="30" width="10" height="22" rx="5" fill="#E8BE95"/>
          </svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1; min-width: 0">
          <div style="font: 500 14px/20px Roboto, sans-serif; letter-spacing: 0.1px; color: #1D1B20">攀岩的手扣住岩壁</div>
          <div style="font: 400 12px/16px Roboto, sans-serif; letter-spacing: 0.4px; color: #49454F">更用力，但抓着什么不太清楚</div>
          <div style="font: 400 11px/16px Roboto, sans-serif; letter-spacing: 0.5px; color: #79747E">pexels.com</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; background: #FEF7FF; border: 1px solid #CAC4D0; border-radius: 16px; padding: 10px">
        <div style="width: 116px; height: 84px; border-radius: 10px; overflow: hidden; flex-shrink: 0">
          <svg width="116" height="84" viewBox="0 0 116 84" fill="none" aria-label="双手握住方向盘">
            <rect width="116" height="84" fill="#D6DBE2"/>
            <circle cx="58" cy="52" r="34" stroke="#4A4F57" stroke-width="10" fill="none"/>
            <circle cx="58" cy="52" r="12" fill="#5B616A"/>
            <rect x="18" y="36" width="20" height="26" rx="10" fill="#D9A981"/>
            <rect x="20" y="32" width="9" height="20" rx="4.5" fill="#EFC79E"/>
            <rect x="78" y="36" width="20" height="26" rx="10" fill="#D9A981"/>
            <rect x="87" y="32" width="9" height="20" rx="4.5" fill="#EFC79E"/>
          </svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1; min-width: 0">
          <div style="font: 500 14px/20px Roboto, sans-serif; letter-spacing: 0.1px; color: #1D1B20">双手握住方向盘</div>
          <div style="font: 400 12px/16px Roboto, sans-serif; letter-spacing: 0.4px; color: #49454F">场景清楚，但更容易记成「开车」</div>
          <div style="font: 400 11px/16px Roboto, sans-serif; letter-spacing: 0.5px; color: #79747E">wikimedia.org</div>
        </div>
      </div>

    </div>

    <div style="display: flex; flex-direction: column; gap: 4px; padding: 0px 16px">
      <div style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0px 8px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0" aria-hidden="true"><path d="M3.5 5.5 20.5 18.5" stroke="#49454F" stroke-width="1.8" stroke-linecap="round"/><rect x="3.2" y="5.2" width="17.6" height="13.6" rx="2.4" stroke="#49454F" stroke-width="1.8"/></svg>
        <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1">
          <div style="font: 400 16px/24px Roboto, sans-serif; letter-spacing: 0.5px; color: #1D1B20">这个词不用配图</div>
          <div style="font: 400 12px/16px Roboto, sans-serif; letter-spacing: 0.4px; color: #49454F">收起图片区域，以后也不再给这个词义找</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0px 8px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.1-5M19 4.5V9h-4.5" stroke="#49454F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1">
          <div style="font: 400 16px/24px Roboto, sans-serif; letter-spacing: 0.5px; color: #1D1B20">三张都不行，重新找</div>
          <div style="font: 400 12px/16px Roboto, sans-serif; letter-spacing: 0.4px; color: #49454F">换一批搜索词再搜一次，约 3 秒</div>
        </div>
      </div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
