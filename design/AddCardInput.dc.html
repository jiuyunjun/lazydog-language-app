<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: Roboto, system-ui, sans-serif; background: #FEF7FF; color: #1D1B20; }
    a { color: #6750A4; } a:hover { color: #4F378B; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #FEF7FF; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; gap: 4px; height: 64px; padding: 0px 4px 0px 4px; flex-shrink: 0">
    <div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" stroke="#1D1B20" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div style="font: 400 22px/28px Roboto, sans-serif; color: #1D1B20">单词学习卡</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 20px; padding: 8px 16px 16px 16px; flex-grow: 1">

    <div style="font: 400 14px/20px Roboto, sans-serif; letter-spacing: 0.25px; color: #49454F">AI 会先把整张卡写出来给你看：释义、搭配、词块、记忆提示、例句。看过之后再决定要不要添加到记录。</div>

    <div style="display: flex; flex-direction: column; gap: 20px">

      <div style="position: relative; height: 56px; border: 1px solid #6750A4; border-radius: 4px; display: flex; align-items: center; padding: 0px 16px">
        <div style="position: absolute; top: -8px; left: 12px; padding: 0px 4px; background: #FEF7FF; font: 400 12px/16px Roboto, sans-serif; letter-spacing: 0.4px; color: #6750A4">英文单词原形</div>
        <div style="font: 400 16px/24px Roboto, sans-serif; letter-spacing: 0.5px; color: #1D1B20">deliberate</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="position: relative; min-height: 56px; border: 1px solid #79747E; border-radius: 4px; display: flex; align-items: center; padding: 0px 16px">
          <div style="font: 400 16px/24px Roboto, sans-serif; letter-spacing: 0.5px; color: #49454F">语境（可选）</div>
        </div>
        <div style="font: 400 12px/16px Roboto, sans-serif; letter-spacing: 0.4px; color: #79747E; padding: 0px 16px">贴上你遇到它的那句话，释义和例句会照着那个意思来</div>
      </div>

    </div>

  </div>

  <div style="background: #F3EDF7; padding: 16px 16px 24px 16px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0">
    <button style="height: 56px; border: none; border-radius: 28px; background: #6750A4; color: #FFFFFF; font: 500 16px/24px Roboto, sans-serif; letter-spacing: 0.15px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4.5 13.6 9l4.4 1.6-4.4 1.6L12 16.6l-1.6-4.4L6 10.6 10.4 9 12 4.5ZM18.5 15.5l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7.7-1.9Z" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/></svg>
      生成学习卡
    </button>
  </div>

</div>
</x-dc>
</body>
</html>
