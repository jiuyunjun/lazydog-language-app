<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: Roboto, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; background: #FEF7FF; color: #1D1B20; }
    a { color: #6750A4; } a:hover { color: #4F378B; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; min-height: 980px; background: #FEF7FF; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; gap: 4px; height: 64px; padding: 0px 4px; flex-shrink: 0">
    <div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="#1D1B20" stroke-width="1.8" stroke-linecap="round"/></svg>
    </div>
    <div style="font: 400 22px/28px Roboto, sans-serif; color: #1D1B20; flex-grow: 1"></div>
  </div>

  <div style="padding: 8px 16px 24px 16px; display: flex; flex-direction: column; gap: 24px; flex-grow: 1">

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font: 400 32px/40px Roboto, sans-serif; color: #1D1B20">今天这两分钟的收成</div>
      <div style="font: 400 14px/20px Roboto, sans-serif; letter-spacing: 0.25px; color: #49454F">听辨 6 题 · 跟读 2 次 · 2 分 10 秒</div>
    </div>

    <div style="background: #E8DEF8; border-radius: 12px; padding: 18px 16px; display: flex; flex-direction: column; gap: 16px">
      <div style="font: 400 24px/32px 'Roboto Mono', monospace; color: #1D192B">/ɪ/ ↔ /iː/</div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: baseline; gap: 8px">
          <div style="font: 400 12px/16px Roboto, sans-serif; letter-spacing: 0.5px; color: #1D192B; flex-grow: 1">听辨</div>
          <div style="font: 400 14px/20px 'Roboto Mono', monospace; color: #4F378B">68%</div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="align-self: center" aria-hidden="true"><path d="M5 12h14M14 7l5 5-5 5" stroke="#4F378B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div style="font: 500 18px/24px 'Roboto Mono', monospace; color: #1D192B">79%</div>
        </div>
        <div style="height: 8px; border-radius: 4px; background: #D0C4E8; display: flex; position: relative">
          <div style="width: 79%; height: 8px; border-radius: 4px; background: #6750A4"></div>
          <div style="position: absolute; left: 68%; top: -2px; width: 2px; height: 12px; background: #4F378B"></div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: baseline; gap: 8px">
          <div style="font: 400 12px/16px Roboto, sans-serif; letter-spacing: 0.5px; color: #1D192B; flex-grow: 1">发音</div>
          <div style="font: 400 14px/20px 'Roboto Mono', monospace; color: #4F378B">71%</div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="align-self: center" aria-hidden="true"><path d="M5 12h14M14 7l5 5-5 5" stroke="#4F378B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div style="font: 500 18px/24px 'Roboto Mono', monospace; color: #1D192B">75%</div>
        </div>
        <div style="height: 8px; border-radius: 4px; background: #D0C4E8; display: flex; position: relative">
          <div style="width: 75%; height: 8px; border-radius: 4px; background: #6750A4"></div>
          <div style="position: absolute; left: 71%; top: -2px; width: 2px; height: 12px; background: #4F378B"></div>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="background: #DCEDE3; border-radius: 12px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0; margin-top: 1px" aria-hidden="true"><path d="M20 6.5 9.5 17 4.5 12" stroke="#0F2A1C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div style="display: flex; flex-direction: column; gap: 3px">
          <div style="font: 500 14px/20px Roboto, sans-serif; letter-spacing: 0.1px; color: #0F2A1C">今天第一次连着分清 ship / sheep</div>
          <div style="font: 400 12px/18px Roboto, sans-serif; color: #0F2A1C">连对 5 次，中间换了一个 speaker 也没被绕进去。</div>
        </div>
      </div>

      <div style="background: #F3EDF7; border-radius: 12px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0; margin-top: 1px" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke="#49454F" stroke-width="1.8"/><path d="M12 8v4.5l3 1.8" stroke="#49454F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div style="display: flex; flex-direction: column; gap: 3px">
          <div style="font: 500 14px/20px Roboto, sans-serif; letter-spacing: 0.1px; color: #1D1B20">还没过的是 live / leave</div>
          <div style="font: 400 12px/18px Roboto, sans-serif; color: #49454F">同一对音，换到这两个词就又混了。下次从它开始。</div>
        </div>
      </div>

      <div style="background: #F3EDF7; border-radius: 12px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0; margin-top: 1px" aria-hidden="true"><rect x="9.2" y="3" width="5.6" height="11" rx="2.8" stroke="#49454F" stroke-width="1.8"/><path d="M5.8 11.5a6.2 6.2 0 0 0 12.4 0M12 17.8V21" stroke="#49454F" stroke-width="1.8" stroke-linecap="round"/></svg>
        <div style="display: flex; flex-direction: column; gap: 3px">
          <div style="font: 500 14px/20px Roboto, sans-serif; letter-spacing: 0.1px; color: #1D1B20">/θ/ 在 3 个词里都站住了</div>
          <div style="font: 400 12px/18px Roboto, sans-serif; color: #49454F">three、think、nothing 都过了 74。下一步是放进句子。</div>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 0px 2px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0" aria-hidden="true"><path d="M12 20.5v-6M12 20.5c-3.6 0-6.5-2-6.5-5 2.8 0 5.2 1.4 6.5 3.4M12 14.5c0-3.4 2.4-6 6-6.5.4 3.6-2 6.5-6 6.5ZM12 14.5c0-2.6-1.6-5-4.5-5.5-.3 2.8 1.6 5 4.5 5.5Z" stroke="#79747E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div style="font: 400 11px/16px Roboto, sans-serif; letter-spacing: 0.5px; color: #79747E">本周这一对从 58% 走到了 79%，是进步最明显的一组。</div>
    </div>

  </div>

  <div style="background: #F3EDF7; padding: 12px 16px 24px 16px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0">
    <div style="height: 48px; border-radius: 24px; background: #6750A4; display: flex; align-items: center; justify-content: center; font: 500 14px/20px Roboto, sans-serif; letter-spacing: 0.1px; color: #FFFFFF">再练 2 分钟</div>
    <div style="height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; font: 500 14px/20px Roboto, sans-serif; letter-spacing: 0.1px; color: #6750A4">今天到这里</div>
  </div>

</div>
</x-dc>
</body>
</html>
